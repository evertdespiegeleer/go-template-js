name: Build (and publish)

on:
  push:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.27
      - run: npm ci
      - run: npm run init
      - run: npm run build
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: node
          path: dist
  
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.27
      - run: npm ci
      - run: npm run init
      - run: npm run test

  publish-npm:
    runs-on: ubuntu-latest
    needs: [build, test]
    if: ${{ github.event_name == 'release' }}
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org/
      - name: Download Node build Artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: "node"
          path: dist
          merge-multiple: true
      - run: npm publish --access=public
